name: Build FocusFlow Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders and place source files
        run: |
          flutter --version
          flutter create --project-name focusflow --org com.focusflow --platforms=android,ios .
          mkdir -p lib
          mv -f *.dart lib/
          rm -rf test analysis_options.yaml
          sed -i 's/android:label="focusflow"/android:label="FocusFlow"/' android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Analyze (informational)
        run: flutter analyze --no-fatal-infos || true

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: focusflow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

